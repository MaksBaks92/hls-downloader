name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch ffmpeg + yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          $ffUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffUrl -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extract" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-extract" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe not found in archive" }
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe" -Force

      - name: PyInstaller
        run: pyinstaller --noconfirm hls_downloader.spec

      - name: Pack zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\HLS Downloader\*" -DestinationPath "HLS-Downloader-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HLS-Downloader-windows
          path: HLS-Downloader-windows.zip

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libxcb-xinerama0 libxkbcommon-x11-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch ffmpeg + yt-dlp
        run: |
          mkdir -p bin
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o bin/yt-dlp
          chmod +x bin/yt-dlp
          # BtbN "latest" tag can 404 intermittently — prefer apt static binary.
          if curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz \
            && tar -tJf ffmpeg.tar.xz >/dev/null 2>&1; then
            mkdir -p ffmpeg-extract
            tar -xJf ffmpeg.tar.xz -C ffmpeg-extract
            FFMPEG_BIN="$(find ffmpeg-extract -type f -name ffmpeg | head -n 1)"
            test -n "$FFMPEG_BIN"
            cp "$FFMPEG_BIN" bin/ffmpeg
          else
            sudo apt-get install -y ffmpeg
            cp "$(command -v ffmpeg)" bin/ffmpeg
          fi
          chmod +x bin/ffmpeg

      - name: PyInstaller
        run: pyinstaller --noconfirm hls_downloader.spec

      - name: Pack zip
        run: |
          (cd "dist/HLS Downloader" && zip -r "$GITHUB_WORKSPACE/HLS-Downloader-linux.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HLS-Downloader-linux
          path: HLS-Downloader-linux.zip

  release:
    name: Publish release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: HLS-Downloader-windows
          path: dist

      - name: Download Linux zip
        uses: actions/download-artifact@v4
        with:
          name: HLS-Downloader-linux
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HLS-Downloader-windows.zip
            dist/HLS-Downloader-linux.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
